{% extends "base.html" %}

{% block title %}404 — Tidak Ditemukan{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem 1.5rem;">
    <h1 style="font-size: 3rem; color: var(--danger); margin-bottom: 0.5rem;">404</h1>
    <h2 style="margin-bottom: 1rem;">Data Tidak Ditemukan</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        {{ message or "Halaman atau entitas data yang Anda cari tidak tersedia di dalam sistem." }}
    </p>
    <a href="{{ url_for('daftar_konsol') }}" class="btn btn-primary">&larr; Kembali ke Daftar Konsol</a>
</div>
{% endblock %}
